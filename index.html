<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeerJS P2P Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    .msg { margin: 5px 0; }
    .sent { color: #0066cc; text-align: right; }
    .received { color: #333; }
    .controls { display: flex; gap: 5px; margin-bottom: 15px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>P2P PeerJS Chat</h2>
  <p><strong>Your ID:</strong> <span id="my-id">Generating...</span></p>

  <div class="controls">
    <input type="text" id="peer-id-input" placeholder="Enter friend's Peer ID" />
    <button onclick="connectToPeer()">Connect</button>
  </div>

  <div id="chat-box"></div>

  <div class="controls">
    <input type="text" id="message-input" placeholder="Type a message..." disabled />
    <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
  </div>

  <script>
    const peer = new Peer();
    let conn = null;

    const myIdEl = document.getElementById('my-id');
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    // Display your generated Peer ID
    peer.on('open', (id) => {
      myIdEl.textContent = id;
    });

    // Handle incoming connections from another peer
    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      setupConnection();
      appendMessage('System', 'Connected to incoming peer!');
    });

    // Connect to another peer manually
    function connectToPeer() {
      const targetId = document.getElementById('peer-id-input').value.trim();
      if (!targetId) return alert('Please enter a Peer ID');
      
      conn = peer.connect(targetId);
      setupConnection();
    }

    // Attach message listeners to active connection
    function setupConnection() {
      conn.on('open', () => {
        messageInput.disabled = false;
        sendBtn.disabled = false;
        appendMessage('System', 'Connected!');
      });

      conn.on('data', (data) => {
        appendMessage('Peer', data, 'received');
      });

      conn.on('close', () => {
        appendMessage('System', 'Connection closed.');
        messageInput.disabled = true;
        sendBtn.disabled = true;
      });
    }

    // Send chat message over DataConnection
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !conn) return;

      conn.send(text);
      appendMessage('You', text, 'sent');
      messageInput.value = '';
    }

    function appendMessage(sender, text, className = '') {
      const div = document.createElement('div');
      div.className = `msg ${className}`;
      div.textContent = `${sender}: ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
